name: CI (Linux ARM64)
on: [push, pull_request]
jobs:
  build-linux-arm64:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        node-version: [18.x]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install Dependencies
        run: npm ci
      - name: Build App
        env:
          TAURI_ARCH: aarch64-linux
        run: npm run tauri build -- --target aarch64-unknown-linux-gnu
      - name: Package AppImage
        run: |
          # locate and archive Artifacts for aarch64
          tar czf chatgpt-linux-arm64.tar.gz src-tauri/target/release/bundle/appimage/*.AppImage
      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: chatgpt-linux-arm64
          path: chatgpt-linux-arm64.tar.gz
