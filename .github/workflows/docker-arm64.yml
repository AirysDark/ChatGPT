name: Build ChatGPT for ARM Cortex-A72 using Docker (ARM64)

on:
  workflow_dispatch:

jobs:
  docker-build-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Enable QEMU for ARM64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build ChatGPT ARM64 image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -f Dockerfile.arm64 \
            -t chatgpt-arm64 . \
            --load

      - name: Extract built artifact
        run: |
          mkdir -p output
          docker run --rm -v ${{ github.workspace }}/output:/out \
            chatgpt-arm64 \
            cp -r /build/src-tauri/target/aarch64-unknown-linux-gnu/release/bundle /out

      - name: Upload ChatGPT ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-linux-arm64
          path: output/bundle
