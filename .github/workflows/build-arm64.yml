name: Build ChatGPT for ARM Cortex-A72 (Linux ARM64)

on:
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x

      - name: Install Rust toolchain and target
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          ~/.cargo/bin/rustup target add aarch64-unknown-linux-gnu

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libwebkit2gtk-4.0-dev \
            build-essential \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            curl git \
            libglib2.0-dev \
            libgdk-pixbuf2.0-dev \
            libgtk-3-dev

      - name: Install frontend dependencies
        run: npm install

      - name: Build ChatGPT with Tauri for ARM64
        run: |
          ~/.cargo/bin/cargo build --release --target aarch64-unknown-linux-gnu
          npm run tauri build -- --target aarch64-unknown-linux-gnu

      - name: Upload Linux ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-linux-arm64
          path: src-tauri/target/aarch64-unknown-linux-gnu/release/bundle
